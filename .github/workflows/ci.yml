name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Privilege-separation tests (root)
        run: |
          # The real System shells out to these; the tests check with them.
          for tool in pkill pgrep crontab gpasswd loginctl systemctl getent setsid; do
            command -v "$tool" >/dev/null || { echo "missing $tool" >&2; exit 1; }
          done
          sudo useradd --system --no-create-home --user-group agent-test
          sudo useradd --system --no-create-home agent-test-provider
          for n in 1 2 3; do
            sudo useradd --system --no-create-home --user-group agent-test-$n
          done
          sudo AGENT_ROOT_TESTS=1 "$(which go)" test ./internal/daemon -run Privilege -v
      - name: Reproducible release build
        run: sh scripts/release_test.sh
      - name: Website
        working-directory: website
        run: go vet ./... && go test ./...
