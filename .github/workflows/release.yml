name: Build Linux bundles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained executable
        env:
          BOT_BUNDLE_STAGE: ${{ runner.temp }}/bot-bundle
        run: python3 scripts/build-bundle.py dist
      - name: Verify self-extracting installer
        run: ${{ runner.temp }}/bot-bundle/runtime/node/bin/node --test test/bundle-packaging.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bot-linux-${{ matrix.arch }}
          path: |
            dist/bot-linux-${{ matrix.arch }}
            dist/bot-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
